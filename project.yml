name: NailongRedact
options:
  bundleIdPrefix: com.allofights
  deploymentTarget:
    iOS: "18.0"
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  NailongRedact:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Models.swift
      - path: AvatarRecolorEngine.swift
      - path: SampleChatGenerator.swift
      - path: ChatRedactionEngine.swift
      - path: LiquidGlassHelpers.swift
      - path: ShortcutsIntent.swift
      - path: iPhoneAppView.swift
      - path: iOSAppEntry.swift
      - path: avatar_base.jpg
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allofights.nailongredact
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 奶龙打码
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 用于读取相册聊天截图并保存打码后的无 EXIF 图片
        NSPhotoLibraryAddUsageDescription: 用于将打码后的聊天截图直接保存到系统相册
        ITSAppUsesNonExemptEncryption: false
